name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: accounting_test
          POSTGRES_USER: accounting
          POSTGRES_PASSWORD: accounting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounting -d accounting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://accounting:accounting@localhost:5432/accounting_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py check
      - run: uv run pytest --cov=apps --cov-report=term-missing --cov-fail-under=85

