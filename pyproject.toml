[project]
name = "accounting-office"
version = "0.1.0"
description = "Central operacional do escritório contábil virtual."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "argon2-cffi>=23.1,<26",
  "dj-database-url>=2.3,<3",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-django>=4.9,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

